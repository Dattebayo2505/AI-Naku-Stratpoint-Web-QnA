# Single command to run the whole chatbot: `docker compose up --build`.
# Two services off one image — api (FastAPI :8000) + ui (Streamlit :8501).
# Chroma is embedded in-process (no DB service); LLM is cloud NVIDIA NIM (no model service).

services:
  api:
    image: stratpoint-rag:local              # build once here; ui reuses the same image
    build: .
    command: uv run uvicorn stratpoint_rag.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/llmops/mlflow.db   # the trace store (Component #8)
      # Writable runtime artifacts move OUT of /app/data. Their defaults
      # (data/uploads, data/proposals) sit under the read-only corpus mount, and
      # a nested volume needs its mountpoint DIRECTORY created inside the parent
      # first — which is read-only, so runc fails the container at start:
      #   mkdirat .../app/data/uploads: read-only file system
      # Mount precedence does not help; the mkdir happens before any of it.
      # Creating data/uploads on the host would fix one machine and break the
      # next: git does not track empty directories and .gitignore excludes both.
      UPLOAD_DIR: /app/uploads
      PROPOSAL_DIR: /app/proposals
    volumes:
      - ./data:/app/data:ro                  # corpus, read-only (produced offline by the crawler)
      - uploads:/app/uploads                 # client briefs (UPLOAD_DIR above)
      - proposals:/app/proposals             # rendered PDFs + HTML twins (PROPOSAL_DIR above)
      - chroma:/app/chroma_db                # persisted vectors — entrypoint auto-ingest writes here
      - hf-cache:/root/.cache/huggingface    # embedding model cache (avoid re-download every boot)
      - llmops:/app/llmops                   # persist the MLflow trace store across restarts
    ports:
      - "8000:8000"
    healthcheck:                             # observability only — the UI is NOT gated on it (it polls /health itself)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  ui:
    image: stratpoint-rag:local              # same image as api — no second build
    command: uv run streamlit run src/stratpoint_rag/ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      STRATPOINT_API_URL: http://api:8000    # reach the API by compose service name
      RUN_INGEST: "0"                         # ui doesn't own the vectors — skip ingest on this service
    env_file: .env
    ports:
      - "8501:8501"
    # Override the image-level HEALTHCHECK, which probes localhost:8000/health.
    # That is correct for the api service and wrong here — this container runs
    # Streamlit on 8501 and reaches the API over the network, so the inherited
    # probe can never pass and the service sits permanently "unhealthy" while
    # working perfectly. Streamlit serves its own liveness endpoint.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_started           # start once api's container is up; the UI's own health polling
                                             # handles the cold-ingest window (shows "Unreachable" -> "Connected")

volumes:
  uploads: {}
  proposals: {}
  chroma: {}
  hf-cache: {}
  llmops: {}
