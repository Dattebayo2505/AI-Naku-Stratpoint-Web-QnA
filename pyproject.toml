[project]
name = "stratpoint-rag"
version = "0.1.0"
description = "RAG chatbot for stratpoint.com: crawler, retrieval pipeline, agent, API, and chat UI."
authors = [
    { name = "Dattebayo2505", email = "seankyled1st@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "markdownify>=1.2.2",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "selectolax>=0.4.10",
    "tenacity>=9.1.4",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # Declared directly ONLY so [tool.uv.sources] can pin it to the CPU wheel
    # index — uv applies sources to the project's own dependencies, not to
    # transitive ones, and torch arrives transitively via sentence-transformers.
    # Nothing imports torch here; the embedder does. See [[tool.uv.index]] below.
    "torch>=2.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.49.0",
    "streamlit>=1.58.0",
    "requests>=2.34.2",
    # docparse: renders PDF pages, reads the embedded text layer, page_count,
    # needs_pass. AGPL unless commercially licensed — if this repo is ever
    # handed over as something shippable, swap to pypdfium2 (BSD/Apache). All
    # rendering is behind docparse/render.py to keep that swap contained.
    "pymupdf>=1.26.0",
    # Explicit (was transitive via streamlit) — pdf_gen templates the proposal.
    "jinja2>=3.1.0",
    # Required by FastAPI to parse the multipart body on POST /upload. It was
    # only ever present transitively; the upload endpoint depends on it directly.
    "python-multipart>=0.0.9",
    # LLMOps (Component #8): MLflow IS the trace store, so these are required,
    # not an extra — /metrics and the trajectory/e2e eval layers read through it.
    # skinny = tracking client only, no server, no sklearn stack. sqlalchemy +
    # alembic are what the sqlite backend needs and are NOT bundled in skinny;
    # the file-store backend that avoids them is in maintenance mode in MLflow 3.x.
    "mlflow-skinny>=2.16",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
nemo = ["nemoguardrails>=0.17.0", "langchain>=0.3.0", "langchain-community>=0.3.0"]

[project.scripts]
stratpoint-crawler = "stratpoint_crawl.cli:main"
stratpoint-rag-ingest = "stratpoint_rag.rag.ingest:main"

# CPU-only torch. On Linux, PyPI's torch drags in the whole CUDA runtime —
# measured from a real `docker compose build`: ~2.1GB of compressed nvidia-*
# wheels (cublas 403MB, cudnn 349MB, cufft 204MB, nccl 196MB, ...) plus torch
# itself, roughly 6-7GB installed. This project has no GPU: generation is a
# cloud NIM call and the embedder runs on CPU, so none of it is ever loaded.
#
# It is not merely waste. The deploy target is a 6GB Proxmox LXC, which a 7GB
# venv cannot fit, and the CUDA download is what filled the build host's disk
# and failed the image build outright.
#
# `explicit = true` keeps this index out of the resolution of every other
# package — without it, uv would search download.pytorch.org for all of them.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["stratpoint_crawl", "stratpoint_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: hits the live network or needs a built local index (deselected by default)"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    # Test fixture only — builds a real .pptx for the live LibreOffice test.
    # Never imported by src/: a deck is rasterized, never text-extracted.
    "python-pptx>=1.0",
]
